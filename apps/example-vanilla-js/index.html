<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Serial RxJS - Vanilla JS Example</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Web Serial RxJS Example</h1>
        <p class="subtitle">Vanilla JavaScript サンプルアプリケーション</p>
      </header>

      <main>
        <!-- Requirements / Browser Support -->
        <section id="requirements-section" class="section">
          <h2 id="requirements-title">利用条件</h2>
          <ul id="requirements-list" class="requirements-list"></ul>
          <h3 class="subsection-title">ブラウザサポート</h3>
          <div id="browser-support-status" class="status-message"></div>
        </section>

        <!-- Connection Section -->
        <section id="connection-section" class="section">
          <h2>シリアルポート接続</h2>
          <div class="button-group">
            <button id="connect-btn" class="btn btn-primary" disabled>
              接続
            </button>
            <button id="disconnect-btn" class="btn btn-secondary" disabled>
              切断
            </button>
          </div>
          <div id="connection-status" class="status-message"></div>
          <h3 class="subsection-title">セッション状態</h3>
          <dl class="session-state-list">
            <div>
              <dt>status</dt>
              <dd id="session-status" data-testid="session-status"></dd>
            </div>
            <div>
              <dt>進行中</dt>
              <dd
                id="session-in-progress"
                data-testid="session-in-progress"
              ></dd>
            </div>
            <div id="session-port-info-row" hidden>
              <dt>ポート情報</dt>
              <dd id="session-port-info" data-testid="session-port-info"></dd>
            </div>
          </dl>
          <h3 class="subsection-title">最新エラー</h3>
          <dl id="session-error-panel" class="session-state-list" hidden>
            <div>
              <dt>message</dt>
              <dd
                id="session-error-message"
                data-testid="session-error-message"
              ></dd>
            </div>
            <div>
              <dt>code</dt>
              <dd
                id="session-error-code"
                data-testid="session-error-code"
              ></dd>
            </div>
            <div id="session-error-context-row" hidden>
              <dt>context</dt>
              <dd
                id="session-error-context"
                data-testid="session-error-context"
              ></dd>
            </div>
          </dl>
          <p
            id="session-error-empty"
            class="session-empty"
            data-testid="session-error-empty"
          >
            エラーはありません。
          </p>
          <div class="button-group">
            <button
              type="button"
              id="clear-error-btn"
              class="btn btn-outline"
              data-testid="clear-error"
              hidden
            >
              エラークリア
            </button>
          </div>
        </section>

        <!-- Configuration Section -->
        <section id="config-section" class="section">
          <h2>接続設定</h2>
          <div class="form-group">
            <label for="baud-rate">ボーレート:</label>
            <select id="baud-rate" class="form-control">
              <option value="9600">9600</option>
              <option value="19200">19200</option>
              <option value="38400">38400</option>
              <option value="57600">57600</option>
              <option value="115200" selected>115200</option>
            </select>
          </div>
        </section>

        <!-- Send Data Section -->
        <section id="send-section" class="section">
          <h2>データ送信</h2>
          <div class="form-group">
            <label for="line-ending">改行コード:</label>
            <select id="line-ending" class="form-control"></select>
          </div>
          <div class="form-group">
            <label for="send-input">送信データ:</label>
            <div class="input-group">
              <input
                type="text"
                id="send-input"
                class="form-control"
                placeholder="送信するテキストを入力..."
                disabled
              />
              <button id="send-btn" class="btn btn-primary" disabled>
                送信
              </button>
            </div>
          </div>
        </section>

        <!-- Receive Data Section -->
        <section id="receive-section" class="section">
          <h2>受信データ</h2>
          <div class="form-group">
            <div class="button-group">
              <button id="clear-receive-btn" class="btn btn-outline">
                クリア
              </button>
            </div>
            <textarea
              id="receive-output"
              class="form-control receive-output"
              readonly
              placeholder="受信データがここに表示されます..."
            ></textarea>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
