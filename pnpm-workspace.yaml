packages:
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true

minimumReleaseAgeExclude:
  # Allow recently published deps from toolchain migrations until they mature (7 days)
  - '@angular/*'
  - '@angular-devkit/*'
  - '@angular-eslint/*'
  - '@asamuzakjp/*'
  - '@commitlint/*'
  - '@csstools/*'
  - '@esbuild/*'
  - '@eslint/*'
  - '@inquirer/*'
  - '@nx/*'
  - '@playwright/*'
  - '@schematics/*'
  - '@sveltejs/*'
  - '@swc/*'
  - '@testing-library/*'
  - '@types/*'
  - '@typescript-eslint/*'
  - '@vitejs/*'
  - '@vitest/*'
  - '@vue/*'
  - angular-eslint
  - data-urls
  - esbuild
  - eslint
  - eslint-plugin-*
  - esrap
  - jsdom
  - linkify-it
  - nx
  - playwright*
  - prettier
  - react
  - react-dom
  - scheduler
  - svelte*
  - tinyglobby
  - tmp
  - tr46
  - typedoc
  - typescript-eslint
  - vite
  - vitest
  - vue*
  - whatwg-url

# Malicious releases are often detected and removed within a week.
# config = 7 day x 24h x 60 min
minimumReleaseAge: 10080

shamefullyHoist: true
